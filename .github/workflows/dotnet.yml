name: .NET


on: [push, pull_request]


jobs:
 build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '9.x'
    - name: Restore dependencies
      run: dotnet restore mod-lab08-server.slnx
    - name: Build
      run: dotnet build --no-restore mod-lab08-server.slnx 
    - name: Test
      run: dotnet test --no-build --verbosity normal
